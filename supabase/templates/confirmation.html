<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f6f6f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1917;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f4;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
        <tr><td style="font-size:20px;font-weight:700;padding-bottom:16px;">Restomate</td></tr>
        <tr><td style="font-size:18px;font-weight:600;padding-bottom:8px;">Confirm your email</td></tr>
        <tr><td style="font-size:14px;line-height:22px;color:#44403c;padding-bottom:24px;">Welcome to Restomate. Confirm your email address to finish creating your account.</td></tr>
        <tr><td style="padding-bottom:24px;">
          <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=signup"
             style="display:inline-block;background:#1c1917;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 24px;border-radius:8px;">Confirm email</a>
        </td></tr>
        <tr><td style="font-size:12px;line-height:18px;color:#78716c;">If you did not create a Restomate account, you can ignore this email. The link can be used once and expires soon.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
