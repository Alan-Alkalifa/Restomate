name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (fake public env only; no secrets in CI)
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://app.example.test
          NEXT_PUBLIC_ROOT_DOMAIN: example.test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon-key-for-ci-build-only
          NEXT_PUBLIC_POSTHOG_KEY: phc_fake_ci_only
          NEXT_PUBLIC_POSTHOG_HOST: https://posthog.example.test

  database:
    name: Supabase db reset + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The CLI download from GitHub returns transient 504s; retry twice before failing the job (B1-T11).
      - id: cli1
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 3.0.0 # pinned; bump deliberately
      - id: cli2
        if: steps.cli1.outcome == 'failure'
        run: sleep 20
      - id: cli2b
        if: steps.cli1.outcome == 'failure'
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 3.0.0
      - if: steps.cli1.outcome == 'failure' && steps.cli2b.outcome == 'failure'
        run: sleep 40
      - id: cli3
        if: steps.cli1.outcome == 'failure' && steps.cli2b.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Supabase CLI is installed
        run: supabase --version
      # Postgres plus storage-api: storage-api creates the `storage` schema, which the
      # storage policy tests (e.g. migration 014_menu_images_storage) need (B1-T13).
      - name: Start local database
        run: |
          supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reset (migrations + seed)
        run: supabase db reset
      - name: Storage schema is present
        run: |
          docker ps --format '{{.Names}}	{{.Status}}' | grep storage
          docker exec "$(docker ps --format '{{.Names}}' | grep '^supabase_db_')" psql -U postgres -tAc "select count(*) from storage.buckets"
      - name: pgTAP (supabase/tests/**)
        # Fails the job on any failed or missing test; do not add continue-on-error.
        run: supabase test db 2>&1 | tee pgtap.log
        shell: bash -o pipefail {0}
      - name: Assert tests actually ran
        run: grep -E "^Result[:] PASS" pgtap.log
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-log
          path: pgtap.log
          if-no-files-found: ignore

  e2e:
    name: Playwright (auth e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The CLI download from GitHub returns transient 504s; retry twice before failing the job (B1-T11).
      - id: cli1
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 3.0.0 # keep in step with the database job
      - id: cli2
        if: steps.cli1.outcome == 'failure'
        run: sleep 20
      - id: cli2b
        if: steps.cli1.outcome == 'failure'
        uses: supabase/setup-cli@v1
        continue-on-error: true
        with:
          version: 3.0.0
      - if: steps.cli1.outcome == 'failure' && steps.cli2b.outcome == 'failure'
        run: sleep 40
      - id: cli3
        if: steps.cli1.outcome == 'failure' && steps.cli2b.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Supabase CLI is installed
        run: supabase --version
      # Auth + Mailpit are required (confirmation and reset mails); the rest of the stack is not.
      - name: Start local Supabase (Auth, Postgres, Mailpit)
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reset (migrations + seed)
        run: supabase db reset
      - name: Export local keys for the app (never printed, never committed)
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Install Chromium for Playwright
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium
      - name: Run e2e (dev server is started by playwright.config.ts)
        run: pnpm --filter ./apps/web test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          EMAIL_DELIVERY: log
          # No ARCJET_KEY on purpose: Arcjet rejects @restomate.local (no MX) and blocks headless browsers.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
